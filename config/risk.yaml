minimum_reward_risk: 1.75
max_position_value: 150
max_new_trades_per_day: 3
max_open_positions: 5
allow_fractional_shares: true
long_only: true
allow_duplicate_ticker: false
allow_averaging_down: false
liquidity:
  min_avg_dollar_volume_20d: 20000000.0
  min_avg_share_volume_20d: 500000
  max_spread_pct: 0.005
  min_price: 5.0
require_fresh_market_data: true
require_required_sources_available: true
sessions:
  allow_auto_execution_in:
  - REGULAR
  allow_signal_generation_in:
  - PRE_MARKET
  - REGULAR
  - AFTER_HOURS
loss_streak_guard:
  enabled: true
  consecutive_losses: 2
  action: PAUSE_NEW_ENTRIES_FOR_SESSION
min_score_standard: 70
min_score_political: 75
kill_switch_engaged: false
orders:
  duplicate_window_seconds: 300
  min_notional: 5.0
  max_entry_drift_pct: 0.01
