name: Keep the demo awake

# Render's free web services sleep after 15 minutes without traffic and take
# 30-60 s to wake. A ping every 10 minutes keeps the instance warm, and a
# public repository's Actions minutes are free. Override the target with a
# repository variable named DEMO_URL. GitHub disables scheduled workflows
# after 60 days without a commit; re-enable it from the Actions tab if so.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the status endpoint
        env:
          DEMO_URL: ${{ vars.DEMO_URL || 'https://trading-universe-demo.onrender.com' }}
        run: |
          # Retry for up to ~2 minutes so a ping that lands on a sleeping
          # instance still wakes it and records the result.
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/status.json -w '%{http_code}' --max-time 60 \
              "$DEMO_URL/api/system/status" || echo 000)
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              python3 -c 'import json;b=json.load(open("/tmp/status.json"));print("bootstrap:",b.get("bootstrap"),"last scan:",b.get("last_scan_at"))'
              exit 0
            fi
            sleep 20
          done
          echo "::warning::demo did not answer 200 after 6 attempts"
